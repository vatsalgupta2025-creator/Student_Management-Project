spring.application.name=student-management
server.port=8080

# ── MongoDB (Student Records) ─────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/student_management}

# ── MySQL / JDBC (Audit Logs via JdbcTemplate) ────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_audit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}

# Run schema.sql on startup to create audit_logs table (IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# If MySQL is not running yet during demo, log notice but keep application running
spring.sql.init.continue-on-error=true

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.example=INFO
