spring.application.name=student-management
server.port=8080

# ── MongoDB ───────────────────────────────────────────────────────────
# Both student records AND audit logs are stored in MongoDB.
# Set MONGO_URI environment variable to override (e.g. Atlas connection string).
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/student_management}

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.example=INFO
